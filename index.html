<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Random Repository Finder</title>
    
    <!-- CSS Stylesheets & Tailwind Output -->
    <link rel="stylesheet" href="assets/style/output.css">
    
    <!-- Google Fonts Integration (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen selection:bg-indigo-500 selection:text-white flex flex-col justify-center items-center p-4">

    <!-- Ambient Neon Background Gradient Effect -->
    <div class="fixed inset-0 bg-[radial-gradient(circle_at_top,var(--tw-gradient-stops))] from-indigo-900/30 via-slate-950 to-slate-950 -z-10"></div>

    <!-- Global Fullscreen Loading Overlay -->
    <div id="loading-overlay" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex flex-col items-center justify-center gap-4 transition-all duration-300">
        <div class="relative flex items-center justify-center">
            <div class="w-12 h-12 rounded-full border-4 border-indigo-500/20 border-t-indigo-500 animate-spin"></div>
        </div>
        <p class="text-sm font-medium text-slate-300 animate-pulse tracking-wide">Fetching random repository...</p>
    </div>

    <!-- Main Content Container -->
    <main class="w-full max-w-md flex flex-col items-center">

        <!-- Dynamic Error Banner Notification (Hidden by default) -->
        <div id="error-container" class="hidden w-full mb-5 p-4 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-300 text-sm flex items-center gap-3 shadow-lg shadow-rose-950/20">
            <svg class="w-5 h-5 shrink-0 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span id="error-message" class="font-medium">An error occurred while fetching data.</span>
        </div>

        <!-- Section 1: Language Selection Form Card -->
        <section id="form-section" class="w-full">
            <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-2xl p-8 space-y-6">
                
                <!-- Card Header -->
                <div class="text-center space-y-2">
                    <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-slate-800 text-indigo-400 border border-slate-700/60 shadow-inner mb-1">
                        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                        </svg>
                    </div>
                    <h1 class="text-2xl font-bold tracking-tight text-white">Find Random Repo</h1>
                    <p class="text-sm text-slate-400">Discover interesting open-source projects on GitHub by language.</p>
                </div>

                <!-- Language Selection Form -->
                <form id="myForm" class="space-y-5">
                    <div class="space-y-2">
                        <label for="language-select" class="block text-xs font-semibold tracking-wider text-slate-300 uppercase">
                            Select Language
                        </label>
                        <div class="relative">
                            <select id="language-select" name="language" class="w-full bg-slate-950/70 border border-slate-700/80 rounded-xl px-4 py-3 text-slate-200 text-sm appearance-none focus:outline-none focus:ring-2 focus:ring-indigo-500/80 focus:border-indigo-500 transition duration-200 cursor-pointer">
                                <option value="" disabled selected>Choose a programming language...</option>
                                <option value="JavaScript">JavaScript</option>
                                <option value="Python">Python</option>
                                <option value="TypeScript">TypeScript</option>
                                <option value="Java">Java</option>
                                <option value="Go">Go</option>
                                <option value="Rust">Rust</option>
                                <option value="C++">C++</option>
                                <option value="PHP">PHP</option>
                            </select>
                            
                            <!-- Custom Select Dropdown Arrow -->
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                                <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
                                    <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <!-- Submit Action Button -->
                    <button id="submit-btn" type="submit" class="w-full inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm py-3 px-5 rounded-xl shadow-lg shadow-indigo-600/25 hover:shadow-indigo-500/35 active:scale-[0.98] transition duration-200 cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                        <span id="submit-btn-text">Find Repository</span>
                    </button>
                </form>

            </div>
        </section>

        <!-- Section 2: Repository Result Card (Hidden by default) -->
        <section id="repo-card" class="w-full hidden">
            <div class="bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-2xl p-8 space-y-6">
                
                <!-- Repository Info Header -->
                <div class="space-y-3">
                    <div class="flex items-center justify-between gap-2">
                        <span id="repo-language" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/10 text-indigo-400 border border-indigo-500/20">
                            <span class="w-2 h-2 rounded-full bg-indigo-400"></span>
                            Language
                        </span>
                        <span class="text-xs text-slate-400 border border-slate-700/60 bg-slate-800/50 px-2.5 py-0.5 rounded-md font-mono">Public</span>
                    </div>

                    <h2 class="text-2xl font-bold text-white tracking-tight break-words">
                        <a id="repo-title" href="#" target="_blank" class="hover:text-indigo-400 transition-colors duration-200">
                            Repo Name
                        </a>
                    </h2>

                    <p id="repo-description" class="text-sm text-slate-300 leading-relaxed line-clamp-3">
                        Repository description placeholder text...
                    </p>
                </div>

                <!-- Repository Metrics Grid -->
                <div class="grid grid-cols-3 gap-3 pt-2">
                    <!-- Stars Metric -->
                    <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="flex items-center justify-center gap-1 text-xs font-medium text-slate-400 mb-1">
                            <svg class="w-3.5 h-3.5 text-amber-400 fill-current" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>
                            Stars
                        </span>
                        <span id="repo-stars" class="text-base font-bold text-amber-400">0</span>
                    </div>

                    <!-- Forks Metric -->
                    <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="flex items-center justify-center gap-1 text-xs font-medium text-slate-400 mb-1">
                            <svg class="w-3.5 h-3.5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/></svg>
                            Forks
                        </span>
                        <span id="repo-forks" class="text-base font-bold text-blue-400">0</span>
                    </div>

                    <!-- Open Issues Metric -->
                    <div class="bg-slate-950/60 border border-slate-800/80 rounded-xl p-3 text-center">
                        <span class="flex items-center justify-center gap-1 text-xs font-medium text-slate-400 mb-1">
                            <svg class="w-3.5 h-3.5 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            Issues
                        </span>
                        <span id="repo-issues" class="text-base font-bold text-rose-400">0</span>
                    </div>
                </div>

                <!-- Action Buttons Area -->
                <div class="flex flex-col gap-3 pt-2">
                    <a id="repo-link" href="#" target="_blank" class="w-full inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm py-3 px-5 rounded-xl shadow-lg shadow-indigo-600/25 hover:shadow-indigo-500/35 active:scale-[0.98] transition duration-200">
                        <svg class="w-4 h-4 fill-current" viewBox="0 0 24 24"><path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
                        View Repository on GitHub
                    </a>
                    
                    <button id="reset-btn" type="button" class="w-full inline-flex items-center justify-center gap-2 bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-sm py-2.5 px-5 rounded-xl border border-slate-700/60 active:scale-[0.98] transition duration-200 cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                        Find Another
                    </button>
                </div>
            </div>
        </section>

    </main>

    <!-- External JavaScript File -->
    <script src="assets/js/app.js"></script>
</body>
</html>
