<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Random Repository</title>
    <link rel="stylesheet" href="assets/style/output.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 antialiased min-h-screen selection:bg-indigo-500 selection:text-white">

    <!-- پس‌زمینه با هاله نور ملايم -->
    <div class="fixed inset-0 bg-[radial-gradient(circle_at_top,var(--tw-gradient-stops))] from-indigo-900/30 via-slate-950 to-slate-950 -z-10"></div>

    <main class="flex items-center justify-center min-h-screen p-4">
        <section class="grr-section w-full max-w-md">
            
            <!-- کارت اصلی -->
            <div class="grr-wrapper bg-slate-900/80 backdrop-blur-xl border border-slate-800 rounded-2xl shadow-2xl p-8 space-y-6">
                
                <!-- هدر کارت -->
                <div class="text-center space-y-2">
                    <div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-slate-800 text-indigo-400 border border-slate-700/60 shadow-inner mb-1">
                        <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24">
                            <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
                        </svg>
                    </div>
                    <h1 class="text-2xl font-bold tracking-tight text-white">Find Random Repo</h1>
                    <p class="text-sm text-slate-400">Discover interesting open-source projects on GitHub by language.</p>
                </div>

                <!-- فرم جستجو -->
                <form action="" id="myForm" class="space-y-5">
                    <div class="space-y-2">
                        <label for="language-select" class="block text-xs font-semibold tracking-wider text-slate-300 uppercase">
                            Select Language
                        </label>
                        <div class="relative">
                            <select id="language-select" name="language" class="w-full bg-slate-950/70 border border-slate-700/80 rounded-xl px-4 py-3 text-slate-200 text-sm appearance-none focus:outline-none focus:ring-2 focus:ring-indigo-500/80 focus:border-indigo-500 transition duration-200 cursor-pointer">
                                <option value="" disabled selected>Choose a programming language...</option>
                                <option value="JavaScript">JavaScript</option>
                                <option value="Python">Python</option>
                                <option value="TypeScript">TypeScript</option>
                                <option value="Java">Java</option>
                                <option value="Go">Go</option>
                                <option value="Rust">Rust</option>
                            </select>
                            <!-- فلش سفارشی برای Dropdown -->
                            <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-slate-400">
                                <svg class="w-4 h-4 fill-current" viewBox="0 0 20 20">
                                    <path d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z"/>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="w-full inline-flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white font-medium text-sm py-3 px-5 rounded-xl shadow-lg shadow-indigo-600/25 hover:shadow-indigo-500/35 active:scale-[0.98] transition duration-200 cursor-pointer">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                        Find Repository
                    </button>
                </form>

            </div>
        </section>
    </main>
    <script src="assets/js/app.js"></script>
</body>
</html>
